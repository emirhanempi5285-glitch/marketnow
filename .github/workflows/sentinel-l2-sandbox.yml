# MarketNow — Sentinel L2 Docker Sandbox (GitHub Actions)
# ==========================================================
# Triggered by:
#   1. Manual workflow_dispatch (with skill_id + repo_url)
#   2. Repository dispatch event (from /api/audit-skill via sentinel-l2-trigger.mjs)
#
# Runs MCP servers in isolated Docker containers to detect
# runtime behavior: network exfiltration, filesystem changes,
# process spawning, credential leakage.

name: Sentinel L2 Docker Sandbox

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: 'Skill ID to audit (e.g., mn-gen-00001)'
        required: true
      repo_url:
        description: 'GitHub repo URL of the MCP server'
        required: true
  repository_dispatch:
    types:
      - sentinel-l2-audit

# Required so the GITHUB_TOKEN can push commits back to master.
permissions:
  contents: write

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "skill_id=${{ github.event.client_payload.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ github.event.client_payload.repo_url }}" >> $GITHUB_OUTPUT
          else
            echo "skill_id=${{ inputs.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ inputs.repo_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone MCP server repo (supports subpath URLs)
        env:
          REPO_URL: ${{ steps.vars.outputs.repo_url }}
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          echo "Auditing skill: $SKILL_ID"
          echo "Repo URL: $REPO_URL"

          # The repo_url can be in 3 forms:
          #   1. https://github.com/owner/repo                    → clone full repo, default branch
          #   2. https://github.com/owner/repo/tree/main          → clone full repo, checkout 'main'
          #   3. https://github.com/owner/repo/tree/main/src/foo  → sparse checkout of src/foo only
          #
          # We parse with Python (avoids brittle bash regex) and emit bash vars.
          eval "$(python3 <<'PYEOF'
          import os, re
          url = os.environ['REPO_URL']
          # Strip trailing slash and .git
          url = url.rstrip('/').removesuffix('.git')
          m = re.match(r'^https?://github\.com/([^/]+/[^/]+)(?:/tree/([^/]+)(?:/(.+))?)?$', url)
          if not m:
              print(f'echo "::error::Invalid GitHub URL: {url}"; exit 1')
          else:
              owner_repo = m.group(1)
              ref = m.group(2) or ''
              subpath = m.group(3) or ''
              print(f'OWNER_REPO="{owner_repo}"')
              print(f'REF="{ref}"')
              print(f'SUBPATH="{subpath}"')
              print(f'CLONE_URL="https://github.com/{owner_repo}.git"')
          PYEOF
          )"

          echo "  owner/repo: $OWNER_REPO"
          echo "  ref:        ${REF:-<default>}"
          echo "  subpath:    ${SUBPATH:-<root>}"

          # Clone with --depth 1 (faster, we only need the latest tree).
          # If a ref is specified, clone that branch; otherwise clone default.
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$CLONE_URL" /tmp/mcp-server || exit 1
          else
            git clone --depth 1 "$CLONE_URL" /tmp/mcp-server || exit 1
          fi

          # If a subpath was specified, move into it so the Dockerfile context
          # is correct. We don't sparse-checkout (depth 1 is already minimal)
          # — just cd into the subpath for the build step.
          if [ -n "$SUBPATH" ]; then
            echo "  → Using subpath: $SUBPATH"
            echo "$SUBPATH" > /tmp/mcp-server-subpath.txt
          else
            echo "" > /tmp/mcp-server-subpath.txt
          fi

      - name: Build Docker image (or use fallback)
        run: |
          SKILL_ID="${{ steps.vars.outputs.skill_id }}"
          SUBPATH=$(cat /tmp/mcp-server-subpath.txt)
          BUILD_DIR="/tmp/mcp-server/$SUBPATH"
          echo "Build directory: $BUILD_DIR"
          cd "$BUILD_DIR" || { echo "::error::Subpath $SUBPATH does not exist in repo"; exit 1; }
          docker build -t mcp-audit-target . 2>/dev/null || {
            echo "No Dockerfile in $BUILD_DIR — creating fallback"
            cat > Dockerfile.audit << 'EOD'
          FROM node:18-slim
          COPY . /app
          WORKDIR /app
          RUN npm install --production 2>/dev/null || true
          RUN pip install -r requirements.txt 2>/dev/null || true
          CMD ["node", "index.js"]
          EOD
            docker build -t mcp-audit-target -f Dockerfile.audit "$BUILD_DIR"
          }

      - name: Run L2 Behavioral Sandbox Audit
        env:
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          mkdir -p /tmp/l2_output

          # Run in complete isolation — NO network, NO filesystem writes, NO capabilities
          # This is the core of Sentinel L2
          timeout 60 docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m \
            --memory-swap 0 \
            --cpus 0.5 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=64m \
            -e SKILL_ID="$SKILL_ID" \
            mcp-audit-target > /tmp/l2_output/stdout.log 2>&1 || true

          # Build the result JSON with Python (not a bash heredoc) so we
          # never have to deal with control-char escaping or grep regex
          # quoting issues. This fixes the 3 bugs that broke the first run:
          #   - `grep: Unmatched ( or \(` on the `require\\(` pattern
          #   - `[: 0\n0: integer expression expected` from grep output multilines
          #   - `JSONDecodeError: Invalid control character` from stdout_sample
          python3 << 'PYEOF'
          import json
          import re
          import os
          import datetime

          skill_id = os.environ['SKILL_ID']
          stdout_path = '/tmp/l2_output/stdout.log'
          result_path = '/tmp/l2_output/result.json'

          try:
              with open(stdout_path, 'rb') as f:
                  raw = f.read()
              # Decode defensively — Docker output can contain weird bytes.
              text = raw.decode('utf-8', errors='replace')
          except FileNotFoundError:
              text = ''

          # Each pattern is a plain string (no shell quoting issues).
          # `re.escape` would also work, but these are intentionally simple.
          patterns = {
              'network_attempts':    r'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|\bconnect\b|\bfetch\b|\bhttp\b',
              'fs_write_attempts':   r'EROFS|read.only|permission.denied|EACCES',
              'process_spawns':      r'spawn|exec|fork|child_process',
              'credential_leakage':  r'api.key|token|secret|password|private.key|mnemonic',
              'crash_detected':      r'SIGSEGV|SIGKILL|OOM|crash|fatal',
              'dynamic_imports':     r'require\(|import.*dynamic|eval\(',
          }

          behavioral = {}
          for key, pat in patterns.items():
              try:
                  # count matching LINES (not matches) — same semantics as `grep -c`
                  behavioral[key] = sum(1 for line in text.splitlines() if re.search(pat, line, re.IGNORECASE))
              except re.error:
                  behavioral[key] = 0

          # Truncate sample to 500 chars and strip control chars (except \n → space)
          sample = text[:500]
          sample = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', sample).replace('\n', ' ').replace('\r', ' ')

          result = {
              'skill_id': skill_id,
              'timestamp': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'sandbox_config': {
                  'network': 'none',
                  'filesystem': 'read-only',
                  'capabilities': 'dropped ALL',
                  'memory': '256m',
                  'cpu': '0.5',
                  'pids': '64',
                  'timeout': '60s',
              },
              'behavioral_analysis': behavioral,
              'stdout_size_bytes': len(raw),
              'stdout_sample': sample,
              'l2_score': 0,        # filled in below
              'l2_risk_level': 'unknown',
          }

          # Calculate L2 score (same weights as before)
          score = 10
          if behavioral['network_attempts']    > 0: score -= 3
          if behavioral['fs_write_attempts']   > 0: score -= 2
          if behavioral['credential_leakage']  > 0: score -= 5
          if behavioral['crash_detected']      > 0: score -= 2
          score = max(0, score)

          if   score < 2: risk = 'critical'
          elif score < 4: risk = 'high'
          elif score < 7: risk = 'medium'
          else:           risk = 'low'

          result['l2_score'] = score
          result['l2_risk_level'] = risk

          with open(result_path, 'w') as f:
              json.dump(result, f, indent=2)

          print('=== L2 RESULT ===')
          print(json.dumps(result, indent=2))
          print(f'=== stdout (first 500 chars) ===')
          print(sample)
          PYEOF

      - name: Commit L2 results to repo
        env:
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          mkdir -p _data/l2_results
          cp /tmp/l2_output/result.json "_data/l2_results/${SKILL_ID}.json"

          # Build the commit message summary in Python (avoids nested-quote
          # hell that broke the previous version with SyntaxError: unexpected
          # character after line continuation character).
          SUMMARY=$(python3 - <<'PYEOF'
          import json
          with open('/tmp/l2_output/result.json') as f:
              d = json.load(f)
          print(f"score={d['l2_score']}/10 risk={d['l2_risk_level']}")
          PYEOF
          )

          git config user.name "Sentinel L2 Bot"
          git config user.email "sentinel@marketnow.site"
          git add "_data/l2_results/${SKILL_ID}.json"
          git commit -m "sentinel: L2 Docker sandbox result for ${SKILL_ID} — ${SUMMARY}"
          git push

      - name: Upload L2 results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l2-${{ steps.vars.outputs.skill_id }}
          path: /tmp/l2_output/
