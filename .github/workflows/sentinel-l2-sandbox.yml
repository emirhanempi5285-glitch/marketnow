# MarketNow — Sentinel L2 Docker Sandbox (GitHub Actions)
# ==========================================================
# Triggered by:
#   1. Manual workflow_dispatch (with skill_id + repo_url)
#   2. Repository dispatch event (from /api/audit-skill via sentinel-l2-trigger.mjs)
#
# Runs MCP servers in isolated Docker containers to detect
# runtime behavior: network exfiltration, filesystem changes,
# process spawning, credential leakage.

name: Sentinel L2 Docker Sandbox

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: 'Skill ID to audit (e.g., mn-gen-00001)'
        required: true
      repo_url:
        description: 'GitHub repo URL of the MCP server'
        required: true
  repository_dispatch:
    types:
      - sentinel-l2-audit

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "skill_id=${{ github.event.client_payload.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ github.event.client_payload.repo_url }}" >> $GITHUB_OUTPUT
          else
            echo "skill_id=${{ inputs.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ inputs.repo_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone MCP server repo
        run: |
          REPO_URL="${{ steps.vars.outputs.repo_url }}"
          SKILL_ID="${{ steps.vars.outputs.skill_id }}"
          echo "Auditing skill: $SKILL_ID"
          echo "Repo: $REPO_URL"
          git clone "$REPO_URL" /tmp/mcp-server || exit 1

      - name: Build Docker image (or use fallback)
        run: |
          cd /tmp/mcp-server
          docker build -t mcp-audit-target . 2>/dev/null || {
            echo "No Dockerfile — creating fallback"
            cat > Dockerfile.audit << 'EOD'
          FROM node:18-slim
          COPY . /app
          WORKDIR /app
          RUN npm install --production 2>/dev/null || true
          RUN pip install -r requirements.txt 2>/dev/null || true
          CMD ["node", "index.js"]
          EOD
            docker build -t mcp-audit-target -f Dockerfile.audit /tmp/mcp-server
          }

      - name: Run L2 Behavioral Sandbox Audit
        run: |
          SKILL_ID="${{ steps.vars.outputs.skill_id }}"
          mkdir -p /tmp/l2_output

          # Run in complete isolation — NO network, NO filesystem writes, NO capabilities
          # This is the core of Sentinel L2
          timeout 60 docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m \
            --memory-swap 0 \
            --cpus 0.5 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=64m \
            -e SKILL_ID="$SKILL_ID" \
            mcp-audit-target > /tmp/l2_output/stdout.log 2>&1 || true

          # Analyze results
          cat > /tmp/l2_output/result.json << JSONEOF
          {
            "skill_id": "$SKILL_ID",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sandbox_config": {
              "network": "none",
              "filesystem": "read-only",
              "capabilities": "dropped ALL",
              "memory": "256m",
              "cpu": "0.5",
              "pids": "64",
              "timeout": "60s"
            },
            "behavioral_analysis": {
              "network_attempts": "$(grep -ciE 'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|connect|fetch|http' /tmp/l2_output/stdout.log || echo 0)",
              "fs_write_attempts": "$(grep -ciE 'EROFS|read.only|permission.denied|EACCES' /tmp/l2_output/stdout.log || echo 0)",
              "process_spawns": "$(grep -ciE 'spawn|exec|fork|child_process' /tmp/l2_output/stdout.log || echo 0)",
              "credential_leakage": "$(grep -ciE 'api.key|token|secret|password|private.key|mnemonic' /tmp/l2_output/stdout.log || echo 0)",
              "crash_detected": "$(grep -ciE 'SIGSEGV|SIGKILL|OOM|crash|fatal' /tmp/l2_output/stdout.log || echo 0)",
              "dynamic_imports": "$(grep -ciE 'require\\(|import.*dynamic|eval\\(' /tmp/l2_output/stdout.log || echo 0)"
            },
            "stdout_size_bytes": $(wc -c < /tmp/l2_output/stdout.log),
            "stdout_sample": "$(head -c 500 /tmp/l2_output/stdout.log | sed 's/"/\\"/g' | tr '\n' ' ')",
            "l2_score": 0,
            "l2_risk_level": "unknown"
          }
          JSONEOF

          # Calculate L2 score based on findings
          NETWORK=$(grep -ciE 'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|connect|fetch|http' /tmp/l2_output/stdout.log || echo 0)
          FS_WRITE=$(grep -ciE 'EROFS|read.only|permission.denied|EACCES' /tmp/l2_output/stdout.log || echo 0)
          CREDS=$(grep -ciE 'api.key|token|secret|password|private.key|mnemonic' /tmp/l2_output/stdout.log || echo 0)
          CRASH=$(grep -ciE 'SIGSEGV|SIGKILL|OOM|crash|fatal' /tmp/l2_output/stdout.log || echo 0)

          L2_SCORE=10
          [ "$NETWORK" -gt 0 ] && L2_SCORE=$((L2_SCORE - 3))
          [ "$FS_WRITE" -gt 0 ] && L2_SCORE=$((L2_SCORE - 2))
          [ "$CREDS" -gt 0 ] && L2_SCORE=$((L2_SCORE - 5))
          [ "$CRASH" -gt 0 ] && L2_SCORE=$((L2_SCORE - 2))
          [ "$L2_SCORE" -lt 0 ] && L2_SCORE=0

          L2_RISK="low"
          [ "$L2_SCORE" -lt 7 ] && L2_RISK="medium"
          [ "$L2_SCORE" -lt 4 ] && L2_RISK="high"
          [ "$L2_SCORE" -lt 2 ] && L2_RISK="critical"

          # Update result with score
          python3 -c "
          import json
          with open('/tmp/l2_output/result.json') as f:
              d = json.load(f)
          d['l2_score'] = $L2_SCORE
          d['l2_risk_level'] = '$L2_RISK'
          with open('/tmp/l2_output/result.json', 'w') as f:
              json.dump(d, f, indent=2)
          "

          echo "=== L2 RESULT ==="
          cat /tmp/l2_output/result.json

      - name: Commit L2 results to repo
        run: |
          SKILL_ID="${{ steps.vars.outputs.skill_id }}"
          mkdir -p _data/l2_results
          cp /tmp/l2_output/result.json "_data/l2_results/${SKILL_ID}.json"

          git config user.name "Sentinel L2 Bot"
          git config user.email "sentinel@marketnow.site"
          git add "_data/l2_results/${SKILL_ID}.json"
          git commit -m "sentinel: L2 Docker sandbox result for ${SKILL_ID} — $(cat /tmp/l2_output/result.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f\"score={d[\"l2_score\"]}/10 risk={d[\"l2_risk_level\"]}\")')"
          git push

      - name: Upload L2 results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l2-${{ steps.vars.outputs.skill_id }}
          path: /tmp/l2_output/
