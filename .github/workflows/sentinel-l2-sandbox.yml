# MarketNow — Sentinel L2 Docker Sandbox (GitHub Actions)
# ==========================================================
# Triggered by:
#   1. Manual workflow_dispatch (with skill_id + repo_url)
#   2. Repository dispatch event (from /api/audit-skill via sentinel-l2-trigger.mjs)
#
# Runs MCP servers in isolated Docker containers to detect
# runtime behavior: network exfiltration, filesystem changes,
# process spawning, credential leakage.

name: Sentinel L2 Docker Sandbox

on:
  workflow_dispatch:
    inputs:
      skill_id:
        description: 'Skill ID to audit (e.g., mn-gen-00001)'
        required: true
      repo_url:
        description: 'GitHub repo URL of the MCP server'
        required: true
  repository_dispatch:
    types:
      - sentinel-l2-audit

# Required so the GITHUB_TOKEN can push commits back to master.
permissions:
  contents: write

jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "skill_id=${{ github.event.client_payload.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ github.event.client_payload.repo_url }}" >> $GITHUB_OUTPUT
          else
            echo "skill_id=${{ inputs.skill_id }}" >> $GITHUB_OUTPUT
            echo "repo_url=${{ inputs.repo_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone MCP server repo (supports subpath URLs)
        env:
          REPO_URL: ${{ steps.vars.outputs.repo_url }}
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          echo "Auditing skill: $SKILL_ID"
          echo "Repo URL: $REPO_URL"

          # The repo_url can be in 3 forms:
          #   1. https://github.com/owner/repo                    → clone full repo, default branch
          #   2. https://github.com/owner/repo/tree/main          → clone full repo, checkout 'main'
          #   3. https://github.com/owner/repo/tree/main/src/foo  → sparse checkout of src/foo only
          #
          # We parse with Python (avoids brittle bash regex) and emit bash vars.
          eval "$(python3 <<'PYEOF'
          import os, re
          url = os.environ['REPO_URL']
          # Strip trailing slash and .git
          url = url.rstrip('/').removesuffix('.git')
          m = re.match(r'^https?://github\.com/([^/]+/[^/]+)(?:/tree/([^/]+)(?:/(.+))?)?$', url)
          if not m:
              print(f'echo "::error::Invalid GitHub URL: {url}"; exit 1')
          else:
              owner_repo = m.group(1)
              ref = m.group(2) or ''
              subpath = m.group(3) or ''
              print(f'OWNER_REPO="{owner_repo}"')
              print(f'REF="{ref}"')
              print(f'SUBPATH="{subpath}"')
              print(f'CLONE_URL="https://github.com/{owner_repo}.git"')
          PYEOF
          )"

          echo "  owner/repo: $OWNER_REPO"
          echo "  ref:        ${REF:-<default>}"
          echo "  subpath:    ${SUBPATH:-<root>}"

          # Clone with --depth 1 (faster, we only need the latest tree).
          # If a ref is specified, clone that branch; otherwise clone default.
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" "$CLONE_URL" /tmp/mcp-server || exit 1
          else
            git clone --depth 1 "$CLONE_URL" /tmp/mcp-server || exit 1
          fi

          # If a subpath was specified, move into it so the Dockerfile context
          # is correct. We don't sparse-checkout (depth 1 is already minimal)
          # — just cd into the subpath for the build step.
          if [ -n "$SUBPATH" ]; then
            echo "  → Using subpath: $SUBPATH"
            echo "$SUBPATH" > /tmp/mcp-server-subpath.txt
          else
            echo "" > /tmp/mcp-server-subpath.txt
          fi

      - name: Build Docker image (or use fallback)
        run: |
          SKILL_ID="${{ steps.vars.outputs.skill_id }}"
          SUBPATH=$(cat /tmp/mcp-server-subpath.txt)
          BUILD_DIR="/tmp/mcp-server/$SUBPATH"
          REPO_ROOT="/tmp/mcp-server"
          echo "Build directory: $BUILD_DIR"
          echo "Repo root:       $REPO_ROOT"
          cd "$BUILD_DIR" || { echo "::error::Subpath $SUBPATH does not exist in repo"; exit 1; }

          # If the repo ships a Dockerfile, use it.
          # Tricky case: monorepo Dockerfiles are inconsistent about build context.
          # Some use COPY paths relative to REPO_ROOT (e.g. "COPY src/everything /app")
          # while others assume context IS the subpath (e.g. "COPY uv.lock /uv.lock").
          # We try BOTH and use whichever succeeds:
          #   attempt 1: context=$BUILD_DIR, Dockerfile=$BUILD_DIR/Dockerfile  (subpath context)
          #   attempt 2: context=$REPO_ROOT, Dockerfile=$BUILD_DIR/Dockerfile  (root context)
          if [ -f "Dockerfile" ] || [ -f "Dockerfile.dev" ]; then
            DOCKERFILE_PATH="Dockerfile"
            [ -f "Dockerfile" ] || DOCKERFILE_PATH="Dockerfile.dev"
            echo "✓ Found $DOCKERFILE_PATH in $BUILD_DIR"

            echo "  Attempt 1: build with context=SUBPATH ($BUILD_DIR)"
            if docker build -t mcp-audit-target -f "$BUILD_DIR/$DOCKERFILE_PATH" "$BUILD_DIR" 2>&1 | tail -40; then
              if docker image inspect mcp-audit-target >/dev/null 2>&1; then
                echo "✓ Image built with subpath context"
                exit 0
              fi
            fi
            echo "  Attempt 1 failed — image not found, trying with context=REPO_ROOT"

            echo "  Attempt 2: build with context=REPO_ROOT ($REPO_ROOT)"
            docker build -t mcp-audit-target -f "$BUILD_DIR/$DOCKERFILE_PATH" "$REPO_ROOT" 2>&1 | tail -40
            if ! docker image inspect mcp-audit-target >/dev/null 2>&1; then
              echo "::error::Both build attempts failed — image mcp-audit-target not found"
              echo "::error::This skill's Dockerfile is incompatible with the sandbox. Marking as failed_to_start."
              exit 1
            fi
            echo "✓ Image built with repo-root context"
            exit 0
          fi

          # Detect project type: Node (package.json) vs Python (pyproject.toml/requirements.txt)
          IS_NODE=0
          IS_PYTHON=0
          [ -f "package.json" ] && IS_NODE=1
          { [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; } && IS_PYTHON=1

          echo "  Detected: IS_NODE=$IS_NODE  IS_PYTHON=$IS_PYTHON"

          if [ "$IS_NODE" = "1" ]; then
            echo "=== Generating Node smart Dockerfile ==="

            # Extract entrypoint info with Python (more robust than jq)
            ENTRYPOINT=$(python3 <<'PYEOF'
            import json, os
            try:
                with open('package.json') as f:
                    pkg = json.load(f)
            except FileNotFoundError:
                print('node index.js')
                exit(0)
            scripts = pkg.get('scripts', {}) or {}
            if 'start' in scripts:
                print(f"sh -c \"{scripts['start']}\"")
                exit(0)
            bin = pkg.get('bin', {})
            if isinstance(bin, dict) and bin:
                print(f"node {list(bin.values())[0]}")
                exit(0)
            if isinstance(bin, str):
                print(f"node {bin}")
                exit(0)
            main = pkg.get('main')
            if main:
                print(f"node {main}")
                exit(0)
            if os.path.exists('dist/index.js'):
                print('node dist/index.js')
            else:
                print('node index.js')
            PYEOF
            )
            echo "  Detected entrypoint: $ENTRYPOINT"

            HAS_TS=$(python3 - <<'PYEOF'
            import json
            try:
                with open('package.json') as f:
                    d = json.load(f)
                deps = {**(d.get('dependencies') or {}), **(d.get('devDependencies') or {})}
                print('yes' if 'typescript' in deps else 'no')
            except Exception:
                print('no')
            PYEOF
            )

            cat > Dockerfile.audit << 'EOD'
          FROM node:20-slim
          WORKDIR /app
          COPY package*.json ./
          RUN npm install --no-audit --no-fund 2>&1 || true
          EOD

            if [ "$HAS_TS" = "yes" ]; then
              echo "  Detected TypeScript — adding build step"
              cat >> Dockerfile.audit << 'EOD'
          COPY tsconfig*.json ./
          RUN npm run build 2>&1 || npx tsc 2>&1 || true
          EOD
            fi

            cat >> Dockerfile.audit << 'EOD'
          COPY . .
          EOD

            if echo "$ENTRYPOINT" | grep -q '^node '; then
              echo "CMD [\"$ENTRYPOINT\"]" | sed 's/ /", "/g' >> Dockerfile.audit
            else
              echo "CMD [\"sh\", \"-c\", \"$ENTRYPOINT\"]" >> Dockerfile.audit
            fi

          elif [ "$IS_PYTHON" = "1" ]; then
            echo "=== Generating Python smart Dockerfile ==="

            # Find the Python entrypoint (look for main.py, <pkg>/__main__.py, app.py, server.py)
            PY_ENTRYPOINT=$(python3 <<'PYEOF'
            import os, re
            # Check pyproject.toml [project.scripts] for an entry
            try:
                with open('pyproject.toml') as f:
                    content = f.read()
                # Look for [project.scripts] section
                m = re.search(r'\[project\.scripts\]\s*\n([^\[]+)', content)
                if m:
                    section = m.group(1)
                    # First line of form "name = 'module:func'" or 'name = "module:func"'
                    line_m = re.search(r'^\s*\w+\s*=\s*[\'"]([^\'"]+)[\'"]', section, re.MULTILINE)
                    if line_m:
                        # Convert "module:func" → "python -c 'from module import func; func()'"
                        target = line_m.group(1)
                        if ':' in target:
                            mod, func = target.split(':', 1)
                            print(f"sh -c \"python -c 'import {mod}; {mod}.{func}()'\"")
                            exit(0)
                        else:
                            print(f"sh -c \"python -c 'import {target}; {target}()'\"")
                            exit(0)
            except FileNotFoundError:
                pass

            # Fallback to common entrypoints
            for candidate in ['main.py', 'app.py', 'server.py', 'src/main.py', 'src/server.py']:
                if os.path.exists(candidate):
                    print(f"python {candidate}")
                    exit(0)
            print('python main.py')
            PYEOF
            )
            echo "  Detected entrypoint: $PY_ENTRYPOINT"

            cat > Dockerfile.audit << 'EOD'
          FROM python:3.12-slim
          WORKDIR /app
          EOD

            if [ -f "pyproject.toml" ]; then
              cat >> Dockerfile.audit << 'EOD'
          COPY pyproject.toml ./
          RUN pip install --no-cache-dir -e . 2>&1 || pip install --no-cache-dir . 2>&1 || true
          EOD
            elif [ -f "requirements.txt" ]; then
              cat >> Dockerfile.audit << 'EOD'
          COPY requirements.txt ./
          RUN pip install --no-cache-dir -r requirements.txt 2>&1 || true
          EOD
            fi

            cat >> Dockerfile.audit << 'EOD'
          COPY . .
          EOD
            echo "CMD [\"sh\", \"-c\", \"$PY_ENTRYPOINT\"]" >> Dockerfile.audit

          else
            echo "::error::No package.json, pyproject.toml, requirements.txt, or setup.py found in $BUILD_DIR"
            exit 1
          fi

          echo "=== Generated Dockerfile.audit ==="
          cat Dockerfile.audit
          echo "==================================="

          docker build -t mcp-audit-target -f Dockerfile.audit "$BUILD_DIR" 2>&1 | tail -30
          # Verify image exists (catch silent failures)
          if ! docker image inspect mcp-audit-target >/dev/null 2>&1; then
            echo "::error::docker build reported success but image mcp-audit-target not found"
            exit 1
          fi
          echo "✓ Image mcp-audit-target built successfully"

      - name: Run L2 Behavioral Sandbox Audit
        env:
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          mkdir -p /tmp/l2_output

          # Run in complete isolation — NO network, NO filesystem writes, NO capabilities
          # This is the core of Sentinel L2
          timeout 60 docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m \
            --memory-swap 0 \
            --cpus 0.5 \
            --pids-limit 64 \
            --tmpfs /tmp:rw,size=64m \
            -e SKILL_ID="$SKILL_ID" \
            mcp-audit-target > /tmp/l2_output/stdout.log 2>&1 || true

          # Build the result JSON with Python (not a bash heredoc) so we
          # never have to deal with control-char escaping or grep regex
          # quoting issues. This fixes the 3 bugs that broke the first run:
          #   - `grep: Unmatched ( or \(` on the `require\\(` pattern
          #   - `[: 0\n0: integer expression expected` from grep output multilines
          #   - `JSONDecodeError: Invalid control character` from stdout_sample
          python3 << 'PYEOF'
          import json
          import re
          import os
          import datetime

          skill_id = os.environ['SKILL_ID']
          stdout_path = '/tmp/l2_output/stdout.log'
          result_path = '/tmp/l2_output/result.json'

          try:
              with open(stdout_path, 'rb') as f:
                  raw = f.read()
              # Decode defensively — Docker output can contain weird bytes.
              text = raw.decode('utf-8', errors='replace')
          except FileNotFoundError:
              text = ''

          # Each pattern is a plain string (no shell quoting issues).
          # `re.escape` would also work, but these are intentionally simple.
          patterns = {
              'network_attempts':    r'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|\bconnect\b|\bfetch\b|\bhttp\b',
              'fs_write_attempts':   r'EROFS|read.only|permission.denied|EACCES',
              'process_spawns':      r'\bspawn\b|\bexec\b|\bfork\b|child_process',
              'credential_leakage':  r'api.key|token|secret|password|private.key|mnemonic',
              'crash_detected':      r'SIGSEGV|SIGKILL|OOM|crash|fatal',
              'dynamic_imports':     r'require\(|import.*dynamic|eval\(',
          }

          behavioral = {}
          for key, pat in patterns.items():
              try:
                  # count matching LINES (not matches) — same semantics as `grep -c`
                  behavioral[key] = sum(1 for line in text.splitlines() if re.search(pat, line, re.IGNORECASE))
              except re.error:
                  behavioral[key] = 0

          # Truncate sample to 500 chars and strip control chars (except \n → space)
          sample = text[:500]
          sample = re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', '', sample).replace('\n', ' ').replace('\r', ' ')

          # ─── Detect "did_not_run" — false-negative guard ────────────────
          # If stdout is empty OR contains MODULE_NOT_FOUND / Cannot find module,
          # the MCP server NEVER actually ran in the sandbox. A score of 10/10
          # would be a FALSE NEGATIVE: we'd be telling users "this skill is
          # safe" when in reality we just failed to execute it.
          #
          # In that case, mark execution_status='failed_to_start' and force
          # score=0 with risk='unknown' (not 'low'). This is the honest answer.
          execution_status = 'ran'
          failure_reason = None
          if len(raw) == 0:
              execution_status = 'failed_to_start'
              failure_reason = 'Empty stdout — Docker container produced no output. Build may have failed silently.'
          elif re.search(r'Cannot find module|MODULE_NOT_FOUND|Error: Cannot find', text):
              execution_status = 'failed_to_start'
              failure_reason = 'Node.js MODULE_NOT_FOUND — the fallback Dockerfile CMD ["node", "index.js"] does not match this server\'s entrypoint. The MCP server never actually ran.'
          elif re.search(r'Command \[.*\] exited with|sh: .*: not found|No such file or directory', text):
              execution_status = 'failed_to_start'
              failure_reason = 'Container command failed to execute — see stdout_sample.'

          result = {
              'skill_id': skill_id,
              'timestamp': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'sandbox_config': {
                  'network': 'none',
                  'filesystem': 'read-only',
                  'capabilities': 'dropped ALL',
                  'memory': '256m',
                  'cpu': '0.5',
                  'pids': '64',
                  'timeout': '60s',
              },
              'execution_status': execution_status,
              'failure_reason': failure_reason,
              'behavioral_analysis': behavioral,
              'stdout_size_bytes': len(raw),
              'stdout_sample': sample,
              'l2_score': 0,        # filled in below
              'l2_risk_level': 'unknown',
          }

          # Calculate L2 score (same weights as before)
          if execution_status == 'failed_to_start':
              # Honest answer: we don't know because it didn't run.
              # Score 0, risk 'unknown' — NOT 'low'. The UI should show this
              # differently from a real 'low' risk.
              score = 0
              risk = 'unknown'
          else:
              score = 10
              if behavioral['network_attempts']    > 0: score -= 3
              if behavioral['fs_write_attempts']   > 0: score -= 2
              if behavioral['credential_leakage']  > 0: score -= 5
              if behavioral['crash_detected']      > 0: score -= 2
              score = max(0, score)

              if   score < 2: risk = 'critical'
              elif score < 4: risk = 'high'
              elif score < 7: risk = 'medium'
              else:           risk = 'low'

          result['l2_score'] = score
          result['l2_risk_level'] = risk

          with open(result_path, 'w') as f:
              json.dump(result, f, indent=2)

          print('=== L2 RESULT ===')
          print(json.dumps(result, indent=2))
          print(f'=== stdout (first 500 chars) ===')
          print(sample)
          PYEOF

      - name: Commit L2 results to repo (with retry on race)
        env:
          SKILL_ID: ${{ steps.vars.outputs.skill_id }}
        run: |
          mkdir -p _data/l2_results
          cp /tmp/l2_output/result.json "_data/l2_results/${SKILL_ID}.json"

          # Build the commit message summary in Python (avoids nested-quote
          # hell that broke the previous version with SyntaxError: unexpected
          # character after line continuation character).
          SUMMARY=$(python3 - <<'PYEOF'
          import json
          with open('/tmp/l2_output/result.json') as f:
              d = json.load(f)
          print(f"score={d['l2_score']}/10 risk={d['l2_risk_level']}")
          PYEOF
          )

          git config user.name "Sentinel L2 Bot"
          git config user.email "sentinel@marketnow.site"
          git add "_data/l2_results/${SKILL_ID}.json"
          git commit -m "sentinel: L2 Docker sandbox result for ${SKILL_ID} — ${SUMMARY}"

          # Retry push with rebase — multiple L2 sandbox runs can fire in
          # parallel (one per skill), and they all push to master. The first
          # one succeeds; the rest get 'rejected (fetch first)'. We pull
          # --rebase and retry up to 5 times with exponential backoff.
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if git push 2>&1; then
              echo "✓ Push succeeded on attempt $i"
              exit 0
            fi
            echo "⚠ Push attempt $i failed (race condition with parallel L2 run) — pulling rebase and retrying..."
            sleep $((i * 2))
            git pull --rebase origin master || {
              echo "✗ git pull --rebase failed on attempt $i"
              # If rebase fails, abort and bail — the result.json is preserved
              # as an artifact and can be committed manually.
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done
          echo "✗ Could not push after $MAX_RETRIES attempts — result is in artifact"
          exit 1

      - name: Upload L2 results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l2-${{ steps.vars.outputs.skill_id }}
          path: /tmp/l2_output/
