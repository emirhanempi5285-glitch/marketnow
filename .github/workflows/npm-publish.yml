name: Publish npm package with provenance

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: cd aep-marketplace/mcp-server && npm install

      - name: Check NPM_TOKEN
        id: check_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set. Skipping publish."
            echo "To enable: add NPM_TOKEN as a GitHub secret with your npm access token"
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish with provenance (code signing via Sigstore)
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          cd aep-marketplace/mcp-server
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify provenance
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          echo "Package published with Sigstore provenance attestation"
          echo "Verify at: https://www.npmjs.com/package/marketnow-mcp"
          echo "Command: npm audit signatures marketnow-mcp"
