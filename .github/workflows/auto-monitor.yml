# MarketNow — Auto-Monitor (runs every hour)
# ============================================
# Monitors: dev.to comments, GitHub issue comments, npm downloads,
# GitHub stars, site uptime.
# Sends email to eddyflores100@gmail.com when there's new activity.

name: Auto-Monitor

"on":
  schedule:
    # Every hour at minute 15
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run auto-monitor
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          # Fall back to hardcoded keys if secrets not set
          export DEVTO_API_KEY="${DEVTO_API_KEY:-}"
          export GITHUB_TOKEN="${GITHUB_TOKEN:-${{ secrets.GITHUB_TOKEN }}"
          export NOTIFY_EMAIL="${NOTIFY_EMAIL:-eddyflores100@gmail.com}"
          export SMTP_USER="${SMTP_USER:-eddyflores100@gmail.com}"

          python3 scripts/auto-monitor.py

      - name: Commit state
        run: |
          if [ -f .github/monitor-state.json ]; then
            git config user.name "MarketNow Monitor Bot"
            git config user.email "info@alicelabs.site"
            git add .github/monitor-state.json
            if git diff --cached --quiet; then
              echo "No state changes"
            else
              git commit -m "chore: monitor state update [skip ci]" || true
              git push || echo "Push failed (will retry next hour)"
            fi
          fi
