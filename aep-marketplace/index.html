<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ BRANDING UNIFICADO -->
    <title>MarketNow — Agent Skill Marketplace</title>
    <meta name="description" content="MarketNow is the open marketplace for AI agent skills. Search, discover and install 5,000+ real MCP-compatible skills for autonomous agents." />
    <meta name="application-name" content="MarketNow" />
    <meta name="theme-color" content="#050505" />

    <!-- ✅ OPEN GRAPH -->
    <meta property="og:title" content="MarketNow — Agent Skill Marketplace" />
    <meta property="og:description" content="Discover and install 5,000+ real MCP-compatible skills for AI agents. Every skill is sourced from a real open-source repository." />
    <meta property="og:url" content="https://www.marketnow.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarketNow" />

    <!-- ✅ AGENT DISCOVERY — crawlers y agentes pueden encontrar el API -->
    <link rel="alternate" type="application/json" href="/api/skills.json" title="MarketNow Skills API" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ✅ AGENT-READABLE META -->
    <meta name="api:skills" content="https://www.marketnow.site/api/skills.json" />
    <meta name="api:search" content="https://www.marketnow.site/api/skills.json?q={query}" />
    <meta name="api:categories" content="https://www.marketnow.site/api/categories.json" />
    <meta name="api:manifest" content="https://www.marketnow.site/api/manifest.json" />

    <!-- ✅ TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketNow — Agent Skill Marketplace" />
    <meta name="twitter:description" content="Discover and install 5,000+ real MCP-compatible skills for AI agents." />

    <style>
      body { background-color: #050505; color: white; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
