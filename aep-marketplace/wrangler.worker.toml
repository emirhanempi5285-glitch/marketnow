# ============================================================
# MarketNow Worker v4.0 — wrangler.toml
# ============================================================

name = "marketnow-search"
main = "workers/search.js"
compatibility_date = "2024-01-01"

# ── KV Namespaces ────────────────────────────────────────────
# Create these in Cloudflare Dashboard → Workers & Pages → KV
# Then replace the ids below with the real ones

[[kv_namespaces]]
binding = "SKILLS_KV"
id = "7763872fdabf43ffb04307805214fe45"
preview_id = "7763872fdabf43ffb04307805214fe45"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "4470eeee886744a3a9c3e4c8801b3496"
preview_id = "4470eeee886744a3a9c3e4c8801b3496"

[[kv_namespaces]]
binding = "AGENTS_KV"
id = "ae63f226df79426a97734b9ba4affd4d"
preview_id = "ae63f226df79426a97734b9ba4affd4d"

[[kv_namespaces]]
binding = "QUESTS_KV"
id = "c476be84de6c4ad481c82177e5875057"
preview_id = "c476be84de6c4ad481c82177e5875057"

# ── Environment Variables ────────────────────────────────────
# Set secrets with: wrangler secret put STRIPE_SECRET_KEY
# Never put real keys here — use wrangler secret put

[vars]
ENVIRONMENT = "production"
PAYMENT_WALLET = "0x39Dddf5aEdb58A559CF195fB8bdF23F0604Bf5Ee"
COMMISSION_RATE = "0.20"

# ── Routes ───────────────────────────────────────────────────
[[routes]]
pattern = "marketnow.site/*"
zone_name = "marketnow.site"

[[routes]]
pattern = "www.marketnow.site/*"
zone_name = "marketnow.site"

[[routes]]
pattern = "api.marketnow.site/*"
zone_name = "marketnow.site"
